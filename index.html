<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-text">
        <span class="badge">Daily Budget</span>
        <h1>Student Expense Tracker</h1>
        <p class="subtitle">Record your daily expenses, filter by category, and keep track of your spending.</p>
      </div>
      <div class="summary-card" aria-live="polite">
        <span class="summary-label" id="total-label">Total Expenses</span>
        <strong class="summary-amount" id="total-amount">$0.00</strong>
        <span class="summary-meta" id="total-meta">0 expenses recorded</span>
      </div>
    </header>

    <main class="main-grid">
      <!-- Add Expense Form -->
      <section class="card form-card" aria-labelledby="form-heading">
        <h2 id="form-heading">Add New Expense</h2>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="expense-name">Expense Name</label>
            <input
              type="text"
              id="expense-name"
              name="expenseName"
              placeholder="e.g., Campus Lunch, Bus Pass"
              autocomplete="off"
              maxlength="80"
              required
            />
            <p class="error-message" id="name-error" role="alert"></p>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expense-amount">Amount ($)</label>
              <input
                type="number"
                id="expense-amount"
                name="expenseAmount"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                inputmode="decimal"
                required
              />
              <p class="error-message" id="amount-error" role="alert"></p>
            </div>

            <div class="form-group">
              <label for="expense-category">Category</label>
              <select id="expense-category" name="expenseCategory" required>
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
              </select>
              <p class="error-message" id="category-error" role="alert"></p>
            </div>
          </div>

          <button type="submit" class="btn-primary" id="add-expense-btn">
            Add Expense
          </button>
        </form>
      </section>

      <!-- Expense List & Filter -->
      <section class="card list-card" aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading">Expenses</h2>
          <div class="filter-group">
            <label for="category-filter">Filter by category</label>
            <select id="category-filter" name="categoryFilter">
              <option value="All">All Categories</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="expense-list-container" class="expense-list-container">
          <ul id="expense-list" class="expense-list" aria-label="Recorded expenses"></ul>

          <div id="empty-state" class="empty-state">
            <p class="empty-title" id="empty-title">No expenses recorded yet</p>
            <p class="empty-subtitle" id="empty-subtitle">Add your first expense using the form to start tracking your spending.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
